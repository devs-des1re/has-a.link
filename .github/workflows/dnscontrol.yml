name: DNSControl

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dnscontrol.yml"
      - "dnsconfig.js"
      - "utils/reserved.json"
      - "utils/internal.json"

  pull_request:
    paths:
      - "dnsconfig.js"
      - "utils/reserved.json"
      - "utils/internal.json"

  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-dnscontrol
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: gacts/install-dnscontrol@890ba3249712c51203ccb7aba63307c0091e921b # v1.3.4
        with:
          version: 4.14.0

      - name: Run DNSControl checks
        run: dnscontrol check
