name: CI

on:
  pull_request:

  push:
    branches: [main]
    paths:
      - "domains/**"
      - "tests/**"
      - "utils/**"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "package-lock.json"

  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x

      - run: npm ci

      - name: Fetch PR information
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          echo "PR_AUTHOR=${{ github.event.pull_request.user.login }}" >> "$GITHUB_ENV"
          echo "PR_AUTHOR_ID=${{ github.event.pull_request.user.id }}" >> "$GITHUB_ENV"
          echo "PR_LABELS=$(gh pr view "$PR" --json labels --jq '[.labels[].name]')" >> "$GITHUB_ENV"
          echo "CHANGED_FILES=$(gh api --jq '[.[] | select(.status != "removed") | .filename]' "repos/${{ github.repository }}/pulls/$PR/files")" >> "$GITHUB_ENV"
          echo "DELETED_FILES=$(gh api --jq '[.[] | select(.status == "removed") | {name: .filename, data: .patch}]' "repos/${{ github.repository }}/pulls/$PR/files")" >> "$GITHUB_ENV"

      - name: Run tests
        run: npx ava tests/*.test.js --timeout=1m
